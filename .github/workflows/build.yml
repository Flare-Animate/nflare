name: Build & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'nflare-*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ''
          - os: macos-13
            platform: macos
            ext: '.app'
          - os: windows-latest
            platform: windows
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.3'

      - name: Install Haxelib dependencies
        run: |
          libs=(
            stdlib
            datatools
            jsprop
            easeljs
            threejs
            threejs-addons
            bootstrap
            wquery
            hxnodejs-re-htmlparser
            undoqueue
            codegen
          )
          for lib in "${libs[@]}"; do
            echo "::group::Instalando paquete: $lib"
            haxelib install "$lib" > /dev/null 2>&1 || haxelib install "$lib"
            echo "::endgroup::"
            echo "✔ Instalado: $lib"
          done

          # Las versiones de haxelib de estas libs están desactualizadas respecto al código:
          #   - jquery   1.5.4 no tiene js.jquery.ui.Progressbar
          #   - injector 1.2.0 no tiene Injector.addSingleton / getService
          # Se instalan desde git, fijadas a un commit para builds reproducibles.
          haxelib git jquery   https://github.com/yar3333/haxe-jquery   83764af library
          haxelib git injector https://github.com/yar3333/haxe-injector 9aafb86 library

          # Registrar TODOS los módulos locales dentro de modules/ correctamente
          for d in modules/*; do
            if [ -d "$d" ]; then
              mod_name=$(basename "$d")
              if [ -f "$d/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d"
              elif [ -f "$d/library/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d/library"
              fi
              echo "✔ Módulo local registrado: $mod_name"
            fi
          done
        shell: bash

      - name: Build Modules
        run: |
          cd modules
          make build
          cd ..
        shell: bash

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Install player deps
        run: cd player && npm install && cd ..

      - name: Build player
        run: cd player && make build && cd ..

      - name: Install IDE deps
        run: cd ide && npm install && cd ..

      - name: Build IDE
        run: cd ide && make build && cd ..

      - name: Initialize Neutralino app
        run: |
          mkdir -p neutralino-app
          cd neutralino-app
          neu create nflare || true
          cd nflare
          # Nota: Quitamos el neu build de aquí porque se sobreescribiría al copiar los assets del IDE más abajo
        shell: bash

      - name: Copy IDE assets to Neutralino
        run: |
          # 1. Asegurar que la carpeta de destino exista
          mkdir -p neutralino-app/nflare/resources/

          # 2. Copiar el contenido de nanofl de manera segura con rsync (evita fallos si faltan archivos o subcarpetas vacías)
          if [ -d "ide/static/nanofl" ]; then
            rsync -av ide/static/nanofl/ neutralino-app/nflare/resources/
          fi

          # 3. Copiar las otras carpetas de ide/static excluyendo nanofl para evitar duplicados
          rsync -av --exclude='nanofl' ide/static/ neutralino-app/nflare/resources/
        shell: bash

      - name: Package build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Copia el binario de Linux (no tiene extensión)
            cp neutralino-app/nflare/dist/nflare/nflare-* dist/nflare-linux || cp neutralino-app/nflare/dist/nflare/* dist/nflare-linux
            chmod +x dist/nflare-linux
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            # Copia el paquete .app de macOS
            cp -r neutralino-app/nflare/dist/nflare/*.app dist/nflare.app
            ditto -c -k --sequesterRsrc --keepParent dist/nflare.app dist/nflare-macos.zip
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Copia el ejecutable de Windows (.exe)
            cp neutralino-app/nflare/dist/nflare/*.exe dist/nflare-windows.exe
          fi
        shell: bash


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nflare-${{ matrix.platform }}-${{ github.ref_name }}
          path: dist/*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
