name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'nflare-*'

jobs:
  build:
    permissions:
      contents: write

    runs-on: "${{ matrix.os }}"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ''
          - os: macos-13
            platform: macos
            ext: '.app'
          - os: windows-latest
            platform: windows
            ext: '.exe'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.3'

      - name: Install Haxelib dependencies
        shell: bash
        run: |
          set -e

          libs=(
            stdlib
            datatools
            jsprop
            easeljs
            threejs
            threejs-addons
            bootstrap
            wquery
            hxnodejs-re-htmlparser
            undoqueue
            codegen
          )

          for lib in "${libs[@]}"; do
            echo "::group::Installing package: $lib"
            haxelib install "$lib" > /dev/null 2>&1 || haxelib install "$lib"
            echo "::endgroup::"
            echo "Installed: $lib"
          done

          haxelib git jquery https://github.com/yar3333/haxe-jquery 83764af library
          haxelib git injector https://github.com/yar3333/haxe-injector 9aafb86 library

          for d in modules/*; do
            if [ -d "$d" ]; then
              mod_name=$(basename "$d")

              if [ -f "$d/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d"
              elif [ -f "$d/library/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d/library"
              fi

              echo "Local module registered: $mod_name"
            fi
          done

      - name: Build Modules
        shell: bash
        run: |
          set -e
          cd modules
          make build

      - name: Install & Build Player
        shell: bash
        run: |
          set -e
          cd player
          npm install
          make build

      - name: Install & Build IDE
        shell: bash
        run: |
          set -e
          cd ide
          npm install
          make build

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install WebviewJS Dependency
        shell: bash
        run: |
          bun add @webviewjs/webview

      - name: Verify Static Files
        shell: bash
        run: |
          set -e
          test -d ide/static
          test -f ide/static/nanofl/index.html
          find ide/static -type f | sort

      - name: Compile Portable Binary
        shell: bash
        run: |
          set -e

          mkdir -p dist-target/package

          bun build ./desktop.js \
            --compile \
            --minify \
            --bytecode \
            --embed-files \
            --outfile="dist-target/package/nflare-${{ matrix.platform }}${{ matrix.ext }}"

          mkdir -p dist-target/package/ide
          cp -a ide/static dist-target/package/ide/static

          test -f dist-target/package/ide/static/nanofl/index.html

          find dist-target/package -type f | sort

      - name: Package Application
        shell: bash
        run: |
          set -e
          cd dist-target
          7z a -tzip \
            "nflare-${{ matrix.platform }}-${{ github.ref_name }}.zip" \
            package

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: nflare-${{ matrix.platform }}-${{ github.ref_name }}
          path: dist-target/nflare-${{ matrix.platform }}-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create Production GitHub Release
        if: startsWith(github.ref, 'refs/tags/nflare-')
        uses: softprops/action-gh-release@v1
        with:
          files: dist-target/nflare-${{ matrix.platform }}-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
