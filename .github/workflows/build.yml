name: Build & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'nflare-*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ''
          - os: macos-13
            platform: macos
            ext: '.app'
          - os: windows-latest
            platform: windows
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.3'

      - name: Install Haxelib dependencies
        run: |
          libs=(
            stdlib
            datatools
            jsprop
            easeljs
            threejs
            threejs-addons
            bootstrap
            wquery
            hxnodejs-re-htmlparser
            undoqueue
            codegen
          )
          for lib in "${libs[@]}"; do
            echo "::group::Instalando paquete: $lib"
            haxelib install "$lib" > /dev/null 2>&1 || haxelib install "$lib"
            echo "::endgroup::"
            echo "✔ Instalado: $lib"
          done

          # Las versiones de haxelib de estas libs están desactualizadas respecto al código:
          #   - jquery   1.5.4 no tiene js.jquery.ui.Progressbar
          #   - injector 1.2.0 no tiene Injector.addSingleton / getService
          # Se instalan desde git, fijadas a un commit para builds reproducibles.
          haxelib git jquery   https://github.com/yar3333/haxe-jquery   83764af library
          haxelib git injector https://github.com/yar3333/haxe-injector 9aafb86 library

          # Registrar TODOS los módulos locales dentro de modules/ correctamente
          for d in modules/*; do
            if [ -d "$d" ]; then
              mod_name=$(basename "$d")
              if [ -f "$d/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d"
              elif [ -f "$d/library/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d/library"
              fi
              echo "✔ Módulo local registrado: $mod_name"
            fi
          done
        shell: bash

      - name: Build Modules
        run: |
          cd modules
          make build
          cd ..
        shell: bash

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Install player deps
        run: cd player && npm install && cd ..

      - name: Build player
        run: cd player && make build && cd ..

      - name: Install IDE deps
        run: cd ide && npm install && cd ..

      - name: Build IDE
        run: cd ide && make build && cd ..

      - name: Initialize Neutralino app
        run: |
          mkdir -p neutralino-app
          cd neutralino-app
          # Usamos npx para asegurar compatibilidad global de la CLI de Neutralino
          npx @neutralinojs/neu create nflare || true
        shell: bash

      - name: Copy IDE assets to Neutralino
        run: |
          # 1. Asegurar que la carpeta de destino exista
          mkdir -p neutralino-app/nflare/resources/

          # 2. En lugar de rsync, usamos cp -r que funciona en Bash en los 3 sistemas operativos.
          # Copiamos primero el contenido de nanofl directo a la raíz de resources
          if [ -d "ide/static/nanofl" ]; then
            cp -r ide/static/nanofl/* neutralino-app/nflare/resources/
          fi

          # 3. Copiamos el resto de las carpetas de ide/static de forma limpia. 
          # Para evitar usar rsync, copiamos todo y luego borramos el duplicado de nanofl si existiera.
          cp -r ide/static/* neutralino-app/nflare/resources/
          rm -rf neutralino-app/nflare/resources/nanofl
        shell: bash

      - name: Build Neutralino package
        run: |
          cd neutralino-app/nflare
          # Forzamos la instalación de dependencias locales del template y buildeamos con npx
          npm install
          npx @neutralinojs/neu build --release
        shell: bash

      - name: Create artifacts directory
        run: mkdir -p dist
        shell: bash

      - name: Package build
        run: |
          echo "=== Verificando qué carpetas generó Neutralino ==="
          ls -R neutralino-app/nflare/dist/ || echo "La carpeta dist sigue sin aparecer"
          echo "=================================================="

          # Copiar los archivos usando comodines tolerantes al nombre del binario interno
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp neutralino-app/nflare/dist/*/*linux* dist/nflare-linux || cp neutralino-app/nflare/dist/*/* dist/nflare-linux
            chmod +x dist/nflare-linux
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            cp -r neutralino-app/nflare/dist/*/*mac* dist/nflare-mac || cp -r neutralino-app/nflare/dist/*/* dist/nflare-mac
            zip -r dist/nflare-macos.zip dist/nflare-mac
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp neutralino-app/nflare/dist/*/*win*.exe dist/nflare-windows.exe || cp neutralino-app/nflare/dist/*/*.exe dist/nflare-windows.exe
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nflare-${{ matrix.platform }}-${{ github.ref_name }}
          path: dist/*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
