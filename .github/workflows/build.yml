name: Build & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'nflare-*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ''
          - os: macos-13
            platform: macos
            ext: '.app'
          - os: windows-latest
            platform: windows
            ext: '.exe'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.3'

      - name: Install Haxelib dependencies
        run: |
          libs=(
            stdlib
            datatools
            jsprop
            easeljs
            threejs
            threejs-addons
            bootstrap
            wquery
            hxnodejs-re-htmlparser
            undoqueue
            codegen
          )
          for lib in "${libs[@]}"; do
            echo "::group::Instalando paquete: $lib"
            haxelib install "$lib" > /dev/null 2>&1 || haxelib install "$lib"
            echo "::endgroup::"
            echo "✔ Instalado: $lib"
          done

          # Las versiones de haxelib de estas libs están desactualizadas respecto al código:
          #   - jquery   1.5.4 no tiene js.jquery.ui.Progressbar
          #   - injector 1.2.0 no tiene Injector.addSingleton / getService
          # Se instalan desde git, fijadas a un commit para builds reproducibles.
          haxelib git jquery   https://github.com/yar3333/haxe-jquery   83764af library
          haxelib git injector https://github.com/yar3333/haxe-injector 9aafb86 library

          # Registrar TODOS los módulos locales dentro de modules/ correctamente
          for d in modules/*; do
            if [ -d "$d" ]; then
              mod_name=$(basename "$d")
              if [ -f "$d/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d"
              elif [ -f "$d/library/haxelib.json" ]; then
                haxelib dev "$mod_name" "$d/library"
              fi
              echo "✔ Módulo local registrado: $mod_name"
            fi
          done
        shell: bash

      - name: Build Modules
        run: |
          cd modules
          make build
          cd ..
        shell: bash

      - name: Install & Build Player
        run: |
          cd player
          npm install
          make build
          cd ..
        shell: bash

      - name: Install & Build IDE
        run: |
          cd ide
          npm install
          make build
          cd ..
        shell: bash

      # --- CONFIGURACIÓN DEL ENTORNO DE COMPILACIÓN DE ESCRITORIO (BUN) ---
      
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Compile Single Portable Binary
        run: |
          mkdir -p dist-target
          # Bun lee desktop.js, auto-descarga bun-webview y mete la carpeta nanofl dentro del binario
          bun build ./desktop.js --compile --embed-files --outfile=dist-target/nflare-${{ matrix.platform }}${{ matrix.ext }}
        shell: bash

      # --- PUBLICACIÓN AUTOMÁTICA DE ARTEFACTOS Y RELEASES ---

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: nflare-${{ matrix.platform }}-${{ github.ref_name }}
          path: dist-target/*
          retention-days: 30

      - name: Create Production GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-target/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
